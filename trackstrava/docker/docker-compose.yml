# Standalone DB compose for trackstrava — host port 5440 matches the shared `mytracker-db`
# service in consolidated-postgres/compose/docker-compose-local.yml (trackstrava and
# trackmeditation share that one port, so run one of these at a time).
services:

  postgresqldb:
    image: postgres:16.15
    environment:
        - POSTGRES_USER=${TRACKSTRAVA_DB_USER:?set in docker/.env (see .env.example)}
        - POSTGRES_PASSWORD=${TRACKSTRAVA_DB_PASSWORD:?set in docker/.env (see .env.example)}
        - POSTGRES_DB=${TRACKSTRAVA_DB_NAME:-appdb}
    ports:
      - "5440:5432"
    volumes:
        - trackstrava_pg_data:/var/lib/postgresql/data
    healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U ${TRACKSTRAVA_DB_USER} -d ${TRACKSTRAVA_DB_NAME:-appdb}" ]
        interval: 10s
        timeout: 5s
        retries: 5

volumes:
    trackstrava_pg_data:
