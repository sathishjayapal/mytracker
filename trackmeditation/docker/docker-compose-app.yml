services:

  trackmeditation:
    build: ..
    ports:
      - "18080:8080"
      - "18787:8787"
    restart: always
    depends_on:
      postgresqldb:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresqldb:5432/${TRACKMEDITATION_DB_NAME:-appdb}
      - SPRING_DATASOURCE_USERNAME=${TRACKMEDITATION_DB_USER:?set in docker/.env}
      - SPRING_DATASOURCE_PASSWORD=${TRACKMEDITATION_DB_PASSWORD:?set in docker/.env}
