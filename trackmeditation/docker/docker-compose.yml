version: '3.8'
services:

  postgresqldb:
    image: postgres:16.0-alpine
    environment:
      - POSTGRES_USER=${TRACKMEDITATION_DB_USER:?set in docker/.env (see .env.example)}
      - POSTGRES_PASSWORD=${TRACKMEDITATION_DB_PASSWORD:?set in docker/.env (see .env.example)}
      - POSTGRES_DB=${TRACKMEDITATION_DB_NAME:-appdb}
    ports:
      - "5432:5432"
    volumes:
      - trackmeditation_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${TRACKMEDITATION_DB_USER} -d ${TRACKMEDITATION_DB_NAME:-appdb}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  trackmeditation_pg_data:
